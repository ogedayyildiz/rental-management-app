name: Workspace verification
on:
  push:
    branches: ['codex/verify-telemetry-ci']
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-diagnostics
          include-hidden-files: true
          path: .e2e/rental-stage-test-*/
          retention-days: 7
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.2.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://e2e:disposable-ci-only@127.0.0.1:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostics
          include-hidden-files: true
          path: |
            .e2e/report
            .e2e/results
            .e2e/servers.log
          retention-days: 7
